# YOLOv8 Defect Detection Configuration

project:
  name: "DefectYOLO"
  output_dir: "outputs"
  seed: 42

data:
  dataset: "NEU"
  data_dir: "data/processed/yolo_format"
  # NEU dataset has 6 defect classes
  nc: 6
  names: ["crazing", "inclusion", "patches", "pitted_surface", "rolled-in_scale", "scratches"]
  # Dataset split
  train: "train/images"
  val: "val/images"
  test: "test/images"
  # Use GAN augmented data
  use_gan_augmentation: true
  gan_data_dir: "data/processed/gan_generated"
  gan_ratio: 0.5         # Ratio of GAN-generated data in training set

model:
  # YOLO model variant: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  # or yolov11n, yolov11s, yolov11m, yolov11l, yolov11x
  model_name: "yolov8n"
  pretrained: true
  imgsz: 640             # Input image size
  # Attention mechanism (CBAM, SE, CA)
  attention: null        # Options: null, "CBAM", "SE", "CA"
  # Multi-scale feature fusion
  multi_scale: true

training:
  epochs: 300
  batch_size: 16
  patience: 50           # Early stopping patience
  lr0: 0.01              # Initial learning rate
  lrf: 0.01              # Final learning rate factor
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  # Augmentation
  hsv_h: 0.015           # HSV-Hue augmentation
  hsv_s: 0.7             # HSV-Saturation augmentation
  hsv_v: 0.4             # HSV-Value augmentation
  degrees: 0.0           # Image rotation (+/- deg)
  translate: 0.1         # Image translation (+/- fraction)
  scale: 0.5             # Image scale (+/- gain)
  shear: 0.0             # Image shear (+/- deg)
  flipud: 0.0            # Image flip up-down (probability)
  fliplr: 0.5            # Image flip left-right (probability)
  mosaic: 1.0            # Mosaic augmentation (probability)
  mixup: 0.0             # MixUp augmentation (probability)
  # Device
  device: "0"            # cuda device, i.e. 0 or 0,1,2,3 or cpu
  workers: 8

evaluation:
  conf_threshold: 0.25   # Confidence threshold
  iou_threshold: 0.45    # NMS IoU threshold
  metrics: ["mAP50", "mAP50-95", "precision", "recall", "F1"]
  save_predictions: true
  save_dir: "outputs/results"

export:
  format: "onnx"         # Export format: onnx, engine(TensorRT)
  imgsz: 640
  half: false            # FP16 quantization
  int8: false            # INT8 quantization
  simplify: true         # Simplify ONNX model
  opset: 12
  save_dir: "outputs/export"
